<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌灵 DeskLing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 自定义标题栏（无边框窗口） -->
  <header class="titlebar" id="titlebar">
    <div class="brand">
      <span class="brand-logo">灵</span>
      <span class="brand-name">桌灵 DeskLing</span>
    </div>
    <div class="win-ctrls">
      <button id="btnTop" title="置顶切换">📌</button>
      <button id="btnMin" title="最小化">—</button>
      <button id="btnClose" title="关闭到托盘">✕</button>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边栏：模块导航 -->
    <aside class="sidebar">
      <div class="nav" id="moduleNav"></div>
      <div class="sidebar-foot">
        <button class="side-btn" id="btnAbout">关于</button>
        <button class="side-btn" id="btnQuit">退出</button>
      </div>
    </aside>

    <!-- 主内容区：当前模块挂载点 -->
    <main class="content" id="content"></main>
  </div>

  <!-- 先加载各模块（向 DeskLingModules 注册），再加载外壳 -->
  <script src="js/modules/todo/todo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
